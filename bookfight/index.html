<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOOKFIGHT — 책들의 입씨름 단판승부</title>
<meta name="description" content="책끼리 발췌문으로 입씨름하는 3D 격투 중계. 분량·출간연도·저자 특성이 그대로 능력치가 됩니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: #05060a;
    color: #eef2f8;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  #app { position: fixed; inset: 0; }

  :root {
    --red: #ff4a45;
    --blue: #4d8cff;
    --gold: #f0c463;
    --ink: #0b0e16;
    --panel: rgba(12, 15, 24, 0.93);
  }

  /* ───────── 공통 UI ───────── */
  button { font-family: inherit; cursor: pointer; border: 0; }
  .btn {
    background: linear-gradient(180deg, #262e42, #171d2c);
    color: #e8eefb; border: 1px solid #3a4560; border-radius: 10px;
    padding: 11px 18px; font-weight: 800; font-size: 14px;
    transition: transform .08s, filter .15s; letter-spacing: .2px;
  }
  .btn:hover { filter: brightness(1.22); }
  .btn:active { transform: translateY(2px); }
  .btn.primary {
    background: linear-gradient(180deg, #ffd97a, #e0a428);
    color: #2a1c00; border-color: #ffe9a8; font-size: 16px; padding: 13px 26px;
  }
  .btn.ghost { background: transparent; border-color: #38425c; color: #9fb0cc; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }

  /* ───────── 스크린 ───────── */
  .screen {
    position: fixed; inset: 0; z-index: 30;
    display: none; flex-direction: column; align-items: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(22,28,45,.86), rgba(4,5,9,.97));
    backdrop-filter: blur(3px);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 18px 14px 24px;
  }
  .screen.on { display: flex; }
  .screen h1 {
    font-size: clamp(26px, 6vw, 44px); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(180deg, #fff, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-align: center;
  }
  .screen .tag { color: #8fa0bd; font-size: 13px; margin: 4px 0 14px; text-align: center; line-height: 1.6; }
  .wrap { width: min(1080px, 100%); }

  /* ───────── 선택 화면 ───────── */
  .picks { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .pickbox {
    display: flex; align-items: center; gap: 10px; min-height: 74px;
    background: var(--panel); border: 2px solid #2a3348; border-radius: 12px; padding: 10px 12px;
  }
  .pickbox.red { border-color: rgba(255,74,69,.6); box-shadow: inset 0 0 24px rgba(255,74,69,.12); }
  .pickbox.blue { border-color: rgba(77,140,255,.6); box-shadow: inset 0 0 24px rgba(77,140,255,.12); flex-direction: row-reverse; text-align: right; }
  .pickbox img { width: 38px; height: 56px; object-fit: cover; border-radius: 3px; box-shadow: 0 2px 8px #000; }
  .pickbox b { display: block; font-size: 15px; }
  .pickbox small { display: block; color: #93a4c2; font-size: 11px; margin-top: 2px; }
  .pickbox .empty { color: #6b7b96; font-size: 13px; font-weight: 700; }
  .pick-vs { display: flex; align-items: center; font-weight: 900; color: var(--gold); font-size: 20px; padding: 0 6px; }

  #roster {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px; margin: 8px 0 16px;
  }
  .fcard {
    position: relative; display: flex; gap: 9px; text-align: left; align-items: center;
    background: rgba(16,20,32,.9); border: 2px solid #232c40; border-radius: 11px;
    padding: 8px; color: inherit; transition: transform .08s, border-color .15s, background .15s;
  }
  .fcard:hover { border-color: #46557a; background: rgba(26,33,52,.95); }
  .fcard:active { transform: scale(.97); }
  .fcover { width: 42px; height: 62px; object-fit: cover; border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.7); flex: 0 0 auto; }
  .ftitle { font-size: 13px; font-weight: 800; line-height: 1.25; }
  .fauthor { font-size: 10.5px; color: #8ea0be; margin-top: 2px; }
  .fbadges { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 24%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .badge.ghost { background: transparent; color: #7d8ea9; border-color: #333e56; }
  .corner-tag {
    position: absolute; top: -8px; font-size: 9px; font-weight: 900; letter-spacing: 1px;
    padding: 2px 7px; border-radius: 999px; display: none;
  }
  .corner-tag.red { left: 8px; background: var(--red); color: #2a0000; }
  .corner-tag.blue { right: 8px; background: var(--blue); color: #001334; }
  .fcard.sel-red { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 20px rgba(255,74,69,.3); }
  .fcard.sel-blue { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 0 20px rgba(77,140,255,.3); }
  .fcard.sel-red .corner-tag.red, .fcard.sel-blue .corner-tag.blue { display: block; }

  .seedbar {
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid #262f45; border-radius: 12px; padding: 12px; margin-bottom: 14px;
  }
  .seedbar label { font-size: 12px; font-weight: 800; color: #9db0d0; letter-spacing: 1px; }
  #seed-input {
    font-family: 'SFMono-Regular', ui-monospace, Menlo, monospace;
    background: #080b13; border: 1px solid #38425c; border-radius: 8px; color: var(--gold);
    padding: 9px 12px; font-size: 16px; font-weight: 800; width: 148px; text-align: center; letter-spacing: 1px;
  }
  #seed-input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .seed-help { font-size: 11px; color: #7d8ea9; width: 100%; text-align: center; line-height: 1.55; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }

  /* ───────── 계체량 표 ───────── */
  #screen-tape .wrap { max-width: 760px; }
  .tape-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 10px; }
  .th { text-align: center; }
  .th img { width: 84px; height: 124px; object-fit: cover; border-radius: 4px; box-shadow: 0 6px 22px rgba(0,0,0,.8); }
  .th.red img { border: 2px solid var(--red); }
  .th.blue img { border: 2px solid var(--blue); }
  .tn { font-weight: 900; font-size: 15px; margin-top: 7px; }
  .tnick { font-size: 11px; color: var(--gold); font-style: italic; }
  .tauth { font-size: 11px; color: #8ea0be; margin-top: 2px; }
  .th-mid { text-align: center; padding: 0 4px; }
  .vs { font-size: 26px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
  .seedline { font-size: 11px; color: #8ea0be; margin-top: 4px; font-family: ui-monospace, monospace; }
  .seedline b { color: var(--gold); }
  .roundline { font-size: 10px; color: #6f819d; margin-top: 2px; }
  .rivalry {
    text-align: center; font-size: 12.5px; font-weight: 800; color: #ffd97a;
    background: rgba(240,196,99,.1); border: 1px solid rgba(240,196,99,.34);
    border-radius: 8px; padding: 7px 10px; margin-bottom: 10px;
  }
  .tape-rows { background: var(--panel); border: 1px solid #262f45; border-radius: 12px; overflow: hidden; }
  .tape-row { display: grid; grid-template-columns: 1fr 96px 1fr; align-items: center; padding: 6px 10px; font-size: 13px; }
  .tape-row:nth-child(odd) { background: rgba(255,255,255,.028); }
  .tape-row.cond { border-top: 1px solid #2a3348; background: rgba(240,196,99,.07); }
  .tl { text-align: center; font-size: 10.5px; color: #7f90ad; font-weight: 800; letter-spacing: 1px; }
  .tv { font-weight: 800; color: #b9c6dc; }
  .tv.left { text-align: right; padding-right: 10px; }
  .tv.right { text-align: left; padding-left: 10px; }
  .tv.win { color: #fff; text-shadow: 0 0 12px rgba(240,196,99,.7); }
  .traits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .trait { background: rgba(16,20,32,.9); border: 1px solid #262f45; border-radius: 10px; padding: 9px 11px; border-left-width: 4px; }
  .trait.red { border-left-color: var(--red); }
  .trait.blue { border-left-color: var(--blue); }
  .trait b { display: block; font-size: 13px; margin-bottom: 3px; }
  .trait span { font-size: 11px; color: #90a2c0; line-height: 1.5; }

  /* ───────── 결과 ───────── */
  #screen-result .wrap { max-width: 620px; }
  .winner-wrap { display: flex; gap: 14px; align-items: center; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .winner-wrap.red { background: linear-gradient(100deg, rgba(255,74,69,.24), rgba(255,74,69,.03)); border: 1px solid rgba(255,74,69,.5); }
  .winner-wrap.blue { background: linear-gradient(100deg, rgba(77,140,255,.24), rgba(77,140,255,.03)); border: 1px solid rgba(77,140,255,.5); }
  .wcover { width: 92px; height: 136px; object-fit: cover; border-radius: 4px; box-shadow: 0 8px 26px rgba(0,0,0,.85); flex: 0 0 auto; }
  .wlabel { font-size: 10px; font-weight: 900; letter-spacing: 2px; color: var(--gold); }
  .wtext h2 { font-size: 24px; margin: 3px 0; }
  .wauth { font-size: 12px; color: #a8b8d2; }
  .wmethod { margin-top: 8px; font-size: 15px; font-weight: 900; color: #fff; }
  .wdetail { font-size: 11.5px; color: #9fb0cc; margin-top: 4px; line-height: 1.5; }
  .cards { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .jcard { background: rgba(16,20,32,.9); border: 1px solid #2a3348; border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #8ea0be; }
  .jcard span { font-size: 10px; display: block; color: #6f819d; margin-bottom: 1px; }
  .jcard b { color: #b9c6dc; }
  .jcard b.w { color: var(--gold); }
  .rs-head { display: grid; grid-template-columns: 1fr 96px 1fr; font-size: 11px; font-weight: 800; color: #8ea0be; padding: 0 10px 6px; text-align: center; }
  .rs-head span:first-child { text-align: right; }
  .rs-head span:last-child { text-align: left; }
  .rs-vs { color: #6f819d; letter-spacing: 1px; }
  .rs { background: var(--panel); border: 1px solid #262f45; border-radius: 12px; overflow: hidden; }
  .rs-row { display: grid; grid-template-columns: 1fr 96px 1fr; align-items: center; padding: 6px 10px; font-size: 13px; }
  .rs-row:nth-child(odd) { background: rgba(255,255,255,.028); }
  .rl { text-align: center; font-size: 10.5px; color: #7f90ad; font-weight: 800; }
  .rv { font-weight: 800; color: #9fb0cc; }
  .rs-row .rv:first-child { text-align: right; padding-right: 10px; }
  .rs-row .rv:last-child { text-align: left; padding-left: 10px; }
  .rv.win { color: #fff; }
  .loser-line { text-align: center; font-size: 12px; color: #8ea0be; margin-top: 10px; }
  .seed-note {
    text-align: center; font-size: 11px; color: #7d8ea9; margin: 8px 0 14px;
    line-height: 1.6; background: rgba(240,196,99,.07); border: 1px solid rgba(240,196,99,.22);
    border-radius: 8px; padding: 8px 10px;
  }
  .seed-note b { color: var(--gold); font-family: ui-monospace, monospace; }

  /* ───────── 경기 중 오버레이 ───────── */
  #scorebug {
    position: fixed; top: 0; left: 0; right: 0; z-index: 12;
    display: none; padding: 8px 10px 0;
    background: linear-gradient(180deg, rgba(4,6,12,.9), rgba(4,6,12,0));
    pointer-events: none;
  }
  #scorebug.on { display: block; }
  .bug-row { display: grid; grid-template-columns: 1fr 84px 1fr; gap: 8px; align-items: start; max-width: 900px; margin: 0 auto; }
  .side { min-width: 0; }
  .side.blue { text-align: right; }
  .nm { font-size: clamp(12px, 3.2vw, 16px); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px #000; }
  .sub { font-size: 9.5px; color: #a2b3cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .bar { position: relative; height: 11px; background: rgba(0,0,0,.62); border: 1px solid #2c374e; border-radius: 4px; overflow: visible; margin-top: 4px; }
  .bar > i { position: absolute; top: 0; bottom: 0; display: block; border-radius: 3px; transition: width .28s cubic-bezier(.2,.8,.3,1); }
  .side.red .bar > i { left: 0; background: linear-gradient(180deg, #ff7a6a, #d9261e); }
  .side.blue .bar > i { right: 0; background: linear-gradient(180deg, #7fb0ff, #1f5ad9); }
  .bar > i.low { filter: saturate(1.5) brightness(1.15); }
  .bar > i.crit { animation: pulse .55s infinite alternate; }
  @keyframes pulse { to { filter: brightness(1.8); } }
  .bar.stam { height: 5px; margin-top: 3px; opacity: .82; }
  .side.red .bar.stam > i { background: linear-gradient(180deg, #ffe08a, #e0a428); }
  .side.blue .bar.stam > i { background: linear-gradient(180deg, #9ee8d8, #26a58b); }
  .kd { font-size: 10px; letter-spacing: 2px; color: var(--gold); height: 12px; margin-top: 2px; }
  .side.blue .kd { text-align: right; }
  .bug-mid { text-align: center; }
  #clock {
    font-family: ui-monospace, 'SFMono-Regular', monospace; font-size: 22px; font-weight: 900;
    letter-spacing: 1px; text-shadow: 0 2px 10px #000; line-height: 1;
  }
  #clock.urgent { color: #ff6b5e; }
  .rd { font-size: 9px; font-weight: 900; letter-spacing: 2px; color: var(--gold); margin-top: 2px; }
  .dmg-pop {
    position: absolute; top: -14px; font-size: 13px; font-weight: 900; color: #ff8b7e;
    text-shadow: 0 2px 6px #000; animation: pop .9s ease-out forwards; pointer-events: none;
  }
  .side.red .dmg-pop { right: 4px; }
  .side.blue .dmg-pop { left: 4px; }
  .dmg-pop.crit { color: var(--gold); font-size: 17px; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(6px) scale(.7); } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { opacity: 0; transform: translateY(-22px) scale(1); } }

  /* 설전 패널 — 도발/반박을 한 화면에 놓아야 언쟁으로 읽힌다 */
  #debate {
    position: fixed; left: 50%; bottom: 74px; z-index: 13;
    width: min(820px, calc(100vw - 24px));
    transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
  }
  .drow {
    display: flex; gap: 10px; align-items: flex-start;
    background: linear-gradient(100deg, rgba(9,12,20,.95), rgba(9,12,20,.8));
    border: 1px solid #2b3348; border-left-width: 5px;
    border-radius: 10px; padding: 8px 13px;
    backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(10px);
    transition: opacity .2s, transform .2s cubic-bezier(.2,.9,.3,1.2), filter .25s;
  }
  .drow.on { opacity: 1; transform: translateY(0); }
  .drow.dim { filter: brightness(.62) saturate(.7); }
  .drow.red { border-left-color: var(--red); }
  .drow.blue { border-left-color: var(--blue); }
  .dcover { width: 30px; height: 44px; object-fit: cover; border-radius: 2px; flex: 0 0 auto; box-shadow: 0 2px 8px #000; }
  .dbody { min-width: 0; flex: 1; }
  .dhead { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; }
  .dhead b { font-size: 11.5px; font-weight: 900; color: #dbe4f2; }
  .dtag {
    font-size: 9.5px; font-weight: 900; letter-spacing: .5px; padding: 1px 6px; border-radius: 999px;
    background: rgba(240,196,99,.16); color: var(--gold); border: 1px solid rgba(240,196,99,.4);
  }
  .dverdict { font-size: 10px; font-weight: 900; letter-spacing: .5px; }
  .dverdict.win { color: #6ee7a0; }
  .dverdict.lose { color: #ff8b7e; }
  .dline { font-size: clamp(13px, 3.1vw, 17px); font-weight: 700; line-height: 1.5; color: #fff; text-shadow: 0 2px 8px #000; }

  /* 로어서드 — 발췌 자막 */
  #lower-third {
    position: fixed; left: 50%; bottom: 210px; z-index: 13;
    width: min(760px, calc(100vw - 24px));
    transform: translate(-50%, 26px); opacity: 0;
    transition: opacity .22s, transform .22s cubic-bezier(.2,.9,.3,1.2);
    pointer-events: none; display: flex; gap: 0;
  }
  #lower-third.on { opacity: 1; transform: translate(-50%, 0); }
  #lt-bar { width: 6px; border-radius: 3px 0 0 3px; flex: 0 0 auto; }
  .lt-body {
    flex: 1; background: linear-gradient(100deg, rgba(9,12,20,.95), rgba(9,12,20,.82));
    border: 1px solid #2b3348; border-left: 0;
    border-radius: 0 10px 10px 0; padding: 9px 14px 10px;
    backdrop-filter: blur(6px);
  }
  .lt-move { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #90a2c0; }
  .lt-move.crit { color: var(--gold); }
  .lt-move.fin { color: #ff9b6b; }
  #lt-quote { font-size: clamp(14px, 3.4vw, 19px); font-weight: 800; line-height: 1.45; margin: 3px 0 4px; text-shadow: 0 2px 8px #000; }
  #lt-source { font-size: 11px; color: #8ea0be; }
  #lower-third[data-corner="red"] .lt-body { border-color: rgba(255,74,69,.42); }
  #lower-third[data-corner="blue"] .lt-body { border-color: rgba(77,140,255,.42); }

  /* 큰 배너 */
  #banner {
    position: fixed; inset: 0; z-index: 16; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
    opacity: 0; transition: opacity .18s;
  }
  #banner.on { opacity: 1; }
  #banner-main {
    font-size: clamp(38px, 12vw, 104px); font-weight: 900; letter-spacing: 4px;
    text-shadow: 0 6px 30px rgba(0,0,0,.95), 0 0 60px rgba(255,120,60,.5);
    animation: slam .4s cubic-bezier(.2,1.4,.4,1);
  }
  #banner-sub { font-size: clamp(13px, 3.6vw, 20px); font-weight: 800; color: #ffd97a; margin-top: 6px; text-shadow: 0 3px 12px #000; text-align: center; padding: 0 16px; }
  @keyframes slam { 0% { transform: scale(2.4); opacity: 0; } 60% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1); } }
  #banner.ko #banner-main { color: #ff5a4a; }
  #banner.down #banner-main { color: var(--gold); }
  #banner.crit #banner-main { color: #ffe08a; font-size: clamp(28px, 8vw, 64px); }
  #banner.bell #banner-main { color: #cfe0ff; font-size: clamp(24px, 7vw, 54px); }

  /* 해설 티커 */
  #ticker {
    position: fixed; left: 12px; bottom: 12px; z-index: 12;
    width: min(420px, calc(100vw - 24px)); pointer-events: none;
    display: flex; flex-direction: column-reverse; gap: 4px;
  }
  .tline {
    font-size: 12px; font-weight: 700; line-height: 1.45; color: #b9c6dc;
    background: rgba(6,9,16,.78); border-left: 3px solid #37425c;
    border-radius: 0 7px 7px 0; padding: 5px 10px; backdrop-filter: blur(4px);
    opacity: .5;
  }
  .tline.fresh { opacity: 1; color: #eef2f8; animation: slidein .25s ease-out; }
  .tline.hype { border-left-color: var(--gold); }
  .tline.shout { border-left-color: #ff5a4a; }
  @keyframes slidein { from { transform: translateX(-14px); opacity: 0; } }

  #replay-flag, #slowmo-flag {
    position: fixed; z-index: 14; font-size: 11px; font-weight: 900; letter-spacing: 3px;
    padding: 5px 12px; border-radius: 5px; display: none;
  }
  #replay-flag { top: 84px; left: 12px; background: #d9261e; color: #fff; animation: blink 1s infinite; }
  #slowmo-flag { top: 84px; right: 12px; background: rgba(6,9,16,.8); border: 1px solid #4a5674; color: #cfe0ff; }
  #replay-flag.on, #slowmo-flag.on { display: block; }
  @keyframes blink { 50% { opacity: .35; } }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; }

  /* 경기 중 조작 바 */
  #fightbar {
    position: fixed; right: 12px; bottom: 12px; z-index: 13;
    display: none; gap: 6px; align-items: center;
    background: rgba(6,9,16,.8); border: 1px solid #2a3348; border-radius: 10px; padding: 6px;
    backdrop-filter: blur(6px);
  }
  body.in-fight #fightbar { display: flex; }
  #fightbar button {
    background: #1a2131; color: #c3d0e6; border: 1px solid #333e56; border-radius: 7px;
    padding: 7px 10px; font-size: 11.5px; font-weight: 800;
  }
  #fightbar button.on { background: var(--gold); color: #2a1c00; border-color: #ffe9a8; }
  #fightbar button:active { transform: translateY(1px); }

  #loading {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: #05060a; color: #8ea0be; font-size: 13px; font-weight: 700;
  }
  #loading.gone { display: none; }
  .spin { width: 34px; height: 46px; border-radius: 2px 4px 4px 2px; background: linear-gradient(100deg, #e0a428, #f0c463); animation: flip 1.1s infinite ease-in-out; transform-origin: left center; }
  @keyframes flip { 0%,100% { transform: rotateY(0); } 50% { transform: rotateY(-72deg); } }

  @media (max-width: 560px) {
    .picks { grid-template-columns: 1fr; }
    .pick-vs { justify-content: center; padding: 2px; }
    .pickbox.blue { flex-direction: row; text-align: left; }
    #roster { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    .traits { grid-template-columns: 1fr; }
    /* 세로 화면에서는 로어서드와 해설 티커가 겹친다 — 티커를 자막 위로 올리고 한 줄만 남긴다 */
    #debate { bottom: 62px; gap: 4px; }
    .drow { padding: 6px 10px; gap: 8px; }
    .dcover { width: 24px; height: 35px; }
    #lower-third { bottom: 230px; }
    #ticker { display: none; }
    #fightbar { bottom: 10px; padding: 5px; }
    #fightbar button { padding: 6px 8px; font-size: 11px; }
    .th img { width: 66px; height: 98px; }
    .tape-row, .rs-row { grid-template-columns: 1fr 74px 1fr; font-size: 12px; }
    .rs-head { grid-template-columns: 1fr 74px 1fr; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "./lib/three.module.js",
    "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js"
} }
</script>
</head>
<body>

<div id="app"></div>

<!-- ───────── 경기 중 오버레이 ───────── -->
<div id="scorebug">
  <div class="bug-row">
    <div class="side red">
      <div class="nm" id="red-name">—</div>
      <div class="sub" id="red-sub"></div>
      <div class="bar"><i id="red-hp" style="width:100%"></i></div>
      <div class="bar stam"><i id="red-st" style="width:100%"></i></div>
      <div class="kd" id="red-kd"></div>
    </div>
    <div class="bug-mid">
      <div id="clock">5:00</div>
      <div class="rd">ROUND 1 / 1</div>
    </div>
    <div class="side blue">
      <div class="nm" id="blue-name">—</div>
      <div class="sub" id="blue-sub"></div>
      <div class="bar"><i id="blue-hp" style="width:100%"></i></div>
      <div class="bar stam"><i id="blue-st" style="width:100%"></i></div>
      <div class="kd" id="blue-kd"></div>
    </div>
  </div>
</div>

<div id="debate">
  <div class="drow" id="drow-taunt">
    <img class="dcover" id="dt-cover" alt="">
    <div class="dbody">
      <div class="dhead"><b id="dt-who"></b><span class="dtag" id="dt-tag"></span></div>
      <div class="dline" id="dt-line"></div>
    </div>
  </div>
  <div class="drow" id="drow-reply">
    <img class="dcover" id="dr-cover" alt="">
    <div class="dbody">
      <div class="dhead"><b id="dr-who"></b><span class="dverdict" id="dr-verdict"></span></div>
      <div class="dline" id="dr-line"></div>
    </div>
  </div>
</div>

<div id="lower-third">
  <div id="lt-bar"></div>
  <div class="lt-body">
    <div class="lt-move" id="lt-move"></div>
    <div id="lt-quote"></div>
    <div id="lt-source"></div>
  </div>
</div>

<div id="banner" class="banner">
  <div id="banner-main"></div>
  <div id="banner-sub"></div>
</div>

<div id="ticker"></div>
<div id="replay-flag">REPLAY</div>
<div id="slowmo-flag">SLO-MO</div>
<div id="flash"></div>

<div id="fightbar">
  <button id="btn-speed">1.0×</button>
  <button id="btn-free">자유 시점</button>
  <button id="btn-skip">건너뛰기</button>
</div>

<!-- ───────── 선택 화면 ───────── -->
<div class="screen" id="screen-setup">
  <div class="wrap">
    <h1>📚 BOOKFIGHT</h1>
    <p class="tag">
      책끼리 <b>발췌문으로 입씨름</b>해서 단판 승부를 냅니다.<br>
      분량은 체력, 출간연도는 관록, 저자의 성격은 필살기가 됩니다.
    </p>

    <div class="picks">
      <div class="pickbox red" id="pick-red"></div>
      <div class="pick-vs">VS</div>
      <div class="pickbox blue" id="pick-blue"></div>
    </div>

    <div class="seedbar">
      <label for="seed-input">SEED</label>
      <input id="seed-input" inputmode="text" maxlength="16" value="100001">
      <button class="btn ghost" id="btn-reseed">🎲 무작위</button>
      <button class="btn ghost" id="btn-random-match">🃏 대진 무작위</button>
      <div class="seed-help">
        같은 시드 + 같은 대진이면 <b>언제나 같은 경기</b>가 나옵니다.
        시드를 바꾸면 컨디션과 전개가 달라져 <b>승패가 뒤집힐 수 있습니다.</b>
        주소창의 <code>?seed=</code> 로도 지정할 수 있어요.
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btn-tape">계체량 보기 →</button>
    </div>
    <p class="tag" style="margin-top:2px">아래에서 레드 코너 → 블루 코너 순으로 두 권을 고르세요.</p>
    <div id="roster"></div>
  </div>
</div>

<!-- ───────── 계체량 ───────── -->
<div class="screen" id="screen-tape">
  <div class="wrap">
    <h1 style="font-size:clamp(20px,5vw,32px)">TALE OF THE TAPE</h1>
    <p class="tag">계체량 · 전력 비교</p>
    <div id="tape-body"></div>
    <div class="actions" style="margin-top:14px">
      <button class="btn ghost" id="btn-back">← 다시 고르기</button>
      <button class="btn primary" id="btn-fight">🔔 경기 시작</button>
    </div>
  </div>
</div>

<!-- ───────── 결과 ───────── -->
<div class="screen" id="screen-result">
  <div class="wrap">
    <h1 style="font-size:clamp(22px,5.5vw,36px)">경기 결과</h1>
    <div id="result-body"></div>
    <div class="actions">
      <button class="btn primary" id="btn-rematch">🎲 새 시드로 재대결</button>
      <button class="btn" id="btn-same">↻ 같은 시드 다시 보기</button>
      <button class="btn ghost" id="btn-newmatch">← 대진 바꾸기</button>
    </div>
  </div>
</div>

<div id="loading"><div class="spin"></div><span>옥타곤 준비 중…</span></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
