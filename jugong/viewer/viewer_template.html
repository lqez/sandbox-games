<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>둔촌주공 10층 타워형</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f4ef,#202520);--fg:light-dark(#24342c,#edf1e9);--muted:light-dark(#5a6b60,#bdc7bc);--line:light-dark(#cad2c8,#586557);--button:light-dark(#fff,#303d32)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:baseline;flex-wrap:wrap}h1{font-size:25px;margin:0 0 8px;font-weight:650}p{margin:0;color:var(--muted);line-height:1.55}.controls{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:20px 0 16px;border-bottom:1px solid var(--line)}label{display:flex;align-items:center;gap:8px;min-height:36px;cursor:pointer}input[type=checkbox]{width:18px;height:18px;accent-color:#477559}button,select{font:inherit;background:var(--button);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 13px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#315b43;color:#fff;border-color:#315b43}.viewselect{margin-left:auto}.stage{position:relative;width:100%;height:min(72vh,820px);min-height:450px;margin-top:16px;background:#e8ebe4;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;left:16px;bottom:14px;color:#536052;font-size:12px;pointer-events:none}.status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center;padding:18px 0 12px}.note{font-size:13px;padding-top:8px}a{color:inherit}.error{color:#ad3030}footer{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:12px;color:var(--muted)}@media(max-width:640px){main{padding:16px}.controls{gap:12px}.viewselect{margin-left:0}h1{font-size:22px}.stage{min-height:420px;height:60vh}.controls label{width:calc(50% - 8px)}.status button{width:100%}.hint{font-size:11px}}
</style></head>
<body><main>
<header><div><h1>둔촌주공 · 10층 타워형</h1><p>전면 발코니 2줄 · 양측 발코니 각 1줄 · 양쪽 출입구</p></div><p>120 × 132 × 174.2 mm · 약 1:200</p></header>
<div class="controls">
<label><input id="sashes" type="checkbox">발코니 외부 섀시</label>
<label><input id="brackets" type="checkbox">에어컨 거치대</label>
<select id="view" class="viewselect" aria-label="관찰 방향"><option value="iso">입체 보기</option><option value="front">전면</option><option value="back">후면</option><option value="left">좌측 · 출입구</option><option value="right">우측 · 출입구</option><option value="top">위에서 보기</option></select>
</div>
<div class="stage"><canvas id="model" aria-label="회전 및 확대 가능한 둔촌주공 10층 아파트 모델"></canvas><div class="hint">드래그: 회전 · 휠 / 두 손가락: 확대</div></div>
<div class="status"><p id="state" aria-live="polite">모델을 불러오는 중입니다.</p><button id="download" class="primary" disabled>현재 구성 STL 다운로드</button></div>
<p class="note">기본형에는 원래의 창문·문·발코니 난간이 포함됩니다. 외부 섀시와 에어컨 거치대는 별도 선택 항목입니다.</p>
<footer>정림건축의 <a href="https://junglim.info/archives/6466" target="_blank" rel="noopener">둔촌주공 25T형 설계 자료</a>와 제공된 사진을 대조했습니다. 후대에 추가된 외부 섀시·거치대의 세부 배치는 예시이며, 특정 동의 실측 복제본은 아닙니다.</footer>
</main>
<script id="mesh-data" type="application/json">__MESH_DATA__</script>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), canvas=$('model'), ui={sh:$('sashes'),ac:$('brackets'),view:$('view'),state:$('state'),dl:$('download')};
const packed=JSON.parse($('mesh-data').textContent),cache=new Map();
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false,preserveDrawingBuffer:true});
if(!gl){ui.state.textContent='이 브라우저에서 3D 표시를 시작할 수 없습니다.';ui.state.className='error';return;}
const norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const basis=d=>{d=norm(d);const r=norm(cross([0,0,1],d)),u=cross(d,r);return{r,u,d};};
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function program(v,f){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}
const common=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPosition;
layout(location=1) in vec3 aNormal;
uniform vec3 uR,uU,uD;
uniform vec2 uHalf;
out vec3 vWorld,vNormal;
void main(){vec3 q=aPosition-vec3(0.,-2.4,84.);vWorld=q;vNormal=aNormal;gl_Position=vec4(dot(q,uR)/uHalf.x,dot(q,uU)/uHalf.y,-dot(q,uD)/350.,1.);}`;
const pass=program(common,`#version 300 es
precision highp float;
out vec4 color;void main(){color=vec4(1.);}`);
const main=program(common,`#version 300 es
precision highp float;
in vec3 vWorld,vNormal;
uniform vec3 uLR,uLU,uLD,uEye;
uniform sampler2D uShadow;
out vec4 color;
void main(){vec3 n=normalize(vNormal);if(!gl_FrontFacing)n=-n;vec3 s=vec3(dot(vWorld,uLR)/160.,dot(vWorld,uLU)/160.,-dot(vWorld,uLD)/350.)*.5+.5;
float shadow=0.;for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++){float z=texture(uShadow,s.xy+vec2(float(x),float(y))/2048.).r;shadow+=(s.z-.00055<=z?1.:.27)/9.;}
float key=max(0.,dot(n,uLD));float fill=max(0.,dot(n,normalize(vec3(.8,.7,1.2))));float eye=max(0.,dot(n,uEye));
float light=.32+.52*key*shadow+.10*fill+.08*eye;vec3 base=vec3(.86,.85,.80);color=vec4(base*pow(light,.75),1.);}`);
const shadow=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,shadow);gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,2048,2048,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shadow,0);gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Shadow framebuffer incomplete');gl.bindFramebuffer(gl.FRAMEBUFFER,null);
const vao=gl.createVertexArray(),buffer=gl.createBuffer();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);
let count=0,current=null,sequence=0,yaw=-.93,pitch=.34,span=225,shadowDirty=true;
let light=basis([-.9,-1.3,2.5]);
const u3=(p,n,v)=>gl.uniform3fv(gl.getUniformLocation(p,n),v),u2=(p,n,v)=>gl.uniform2fv(gl.getUniformLocation(p,n),v);
function uniforms(p,b,half){u3(p,'uR',b.r);u3(p,'uU',b.u);u3(p,'uD',b.d);u2(p,'uHalf',half);}
function draw(){if(!count)return;gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.bindVertexArray(vao);
 if(shadowDirty){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,2048,2048);gl.clear(gl.DEPTH_BUFFER_BIT);gl.useProgram(pass);uniforms(pass,light,[160,160]);gl.drawArrays(gl.TRIANGLES,0,count);shadowDirty=false;}
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.9098,.9216,.8941,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(main);
 const eye=basis([Math.cos(yaw)*Math.cos(pitch),Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch)]);uniforms(main,eye,[span*canvas.width/canvas.height/2,span/2]);u3(main,'uLR',light.r);u3(main,'uLU',light.u);u3(main,'uLD',light.d);u3(main,'uEye',eye.d);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,shadow);gl.uniform1i(gl.getUniformLocation(main,'uShadow'),0);gl.drawArrays(gl.TRIANGLES,0,count);
 canvas.dataset.triangles=String(count/3);canvas.dataset.variant=String(current?.key??'');canvas.dataset.ready='true';}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw();}new ResizeObserver(resize).observe(canvas);
async function unpack(key){if(cache.has(key))return cache.get(key);const entry=packed[key],raw=Uint8Array.from(atob(entry.data),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const bytes=await new Response(stream).arrayBuffer();const dv=new DataView(bytes),n=dv.getUint32(80,true),data=new Float32Array(n*18);for(let i=0;i<n;i++){const k=84+i*50,nx=dv.getFloat32(k,true),ny=dv.getFloat32(k+4,true),nz=dv.getFloat32(k+8,true);for(let j=0;j<3;j++){const t=i*18+j*6,v=k+12+j*12;data[t]=dv.getFloat32(v,true);data[t+1]=dv.getFloat32(v+4,true);data[t+2]=dv.getFloat32(v+8,true);data[t+3]=nx;data[t+4]=ny;data[t+5]=nz;}}const result={key,bytes,data,name:entry.name,n};cache.set(key,result);return result;}
async function change(){const seq=++sequence,key=(ui.sh.checked?1:0)+(ui.ac.checked?2:0);ui.dl.disabled=true;ui.state.textContent='구성을 적용하는 중입니다.';try{const model=await unpack(key);if(seq!==sequence)return;current=model;count=model.n*3;gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,model.data,gl.STATIC_DRAW);shadowDirty=true;resize();ui.state.textContent=['기본형','외부 섀시 포함','에어컨 거치대 포함','외부 섀시 · 에어컨 거치대 포함'][key];ui.dl.disabled=false;}catch(e){ui.state.textContent='모델 표시 오류: '+e.message;ui.state.className='error';console.error(e);}}
ui.sh.addEventListener('change',change);ui.ac.addEventListener('change',change);
ui.view.addEventListener('change',()=>{const v={iso:[-.93,.34,225],front:[-Math.PI/2,.0,210],back:[Math.PI/2,.0,210],left:[Math.PI,.0,210],right:[0,.0,210],top:[-Math.PI/2,Math.PI/2-.01,170]}[ui.view.value];[yaw,pitch,span]=v;draw();});
ui.dl.addEventListener('click',()=>{if(!current)return;const url=URL.createObjectURL(new Blob([current.bytes],{type:'model/stl'}));const a=document.createElement('a');a.href=url;a.download=current.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);});
const pointers=new Map();let pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){const a=[...pointers.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw-=(e.clientX-prev[0])*.007;pitch=Math.max(-.25,Math.min(1.56,pitch+(e.clientY-prev[1])*.006));}else{const a=[...pointers.values()],dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch>0)span=Math.max(70,Math.min(420,span*pinch/dist));pinch=dist;}ui.view.value='iso';draw();});
for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=0;});
canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(70,Math.min(420,span*Math.exp(e.deltaY*.001)));draw();},{passive:false});
window.modelViewer={getState:()=>({sashes:ui.sh.checked,brackets:ui.ac.checked,variant:current?.key,triangles:count/3,ready:!!count})};
change();
})();
</script></body></html>
